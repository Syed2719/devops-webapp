name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build project
        run: |
          echo "Building DevOps Web App"
          echo "Build successful"

      - name: Run tests
        run: |
          echo "Running tests"
          echo "Tests completed successfully"

      - name: Send Slack notification
        if: always()
        run: |
          curl -X POST \
            -H "Content-type: application/json" \
            --data '{"text":"CI Pipeline completed for DevOps Web App."}' \
            "$SLACK_WEBHOOK_URL"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
